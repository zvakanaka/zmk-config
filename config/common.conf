# Settings every keyboard in this repo shares (build.sh passes this as EXTRA_CONF_FILE for every target;
# a keyboard's own config/<name>.conf adds to it).

# Mouse keys (the Nav layer)
CONFIG_ZMK_POINTING=y

# Report the peripheral (right) half's battery to the host as a second battery service
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Deep sleep after 30 minutes without a key press. Each half sleeps on its own; any key wakes it and the
# keyboard reconnects. Never while USB power is connected.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000
