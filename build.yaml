# Build targets for ./build.sh (same format ZMK's GitHub Actions matrix uses).
# Each entry needs a board; shield, snippet, cmake-args and artifact-name are optional.
---
include:
  - board: nice_nano@2.0.0//zmk
    shield: corne_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n
    artifact-name: corne_left
  - board: nice_nano@2.0.0//zmk
    shield: corne_right
    artifact-name: corne_right
  - board: nice_nano@2.0.0//zmk
    shield: settings_reset
    artifact-name: settings_reset
